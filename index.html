<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c16">
  <title>Hessin AI 2.0</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">H</div>
      <div>
        <h1>Hessin AI 2.0</h1>
        <p>وكيل متعدد الخطوات والأدوات</p>
      </div>
      <span class="status">● جاهز</span>
    </header>
    <section id="chat" class="chat">
      <div class="msg ai">
        <b>Hessin AI</b>
        <div>مرحباً. أقدر أبحث، أحسب، أحفظ معلومات، وأنشئ ملفات. مثال: ابحث عن 5 منتجات مربحة في مصر يمكن بيعها في السودان بميزانية 300 دولار، واحسب الكمية والربح المتوقع.</div>
      </div>
    </section>
    <div id="approval" class="approval hidden">
      <div id="approvalText"></div>
      <button id="approve" type="button">أوافق</button>
    </div>
    <form id="form" class="composer">
      <textarea id="input" rows="1" placeholder="اكتب المهمة هنا…"></textarea>
      <button id="send" type="submit">تنفيذ</button>
    </form>
    <div class="hint">الإجراءات الحساسة تحتاج موافقتك. المفتاح يبقى في Vercel فقط.</div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
