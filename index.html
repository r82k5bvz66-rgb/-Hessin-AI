<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c16">
  <title>Hessin AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">H</div>
      <div>
        <h1>Hessin AI</h1>
        <p>وكيلك الشخصي الذكي</p>
      </div>
      <span class="status">● جاهز</span>
    </header>
    <section id="chat" class="chat">
      <div class="msg ai">
        <b>Hessin AI</b>
        <div>مرحباً. اطلب مني البحث أو الحساب أو كتابة محتوى.</div>
      </div>
    </section>
    <form id="form" class="composer">
      <textarea id="input" rows="1" placeholder="اكتب مهمتك هنا…"></textarea>
      <button id="send" type="submit">تنفيذ</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
