<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#080c16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Hessin AI — وكيلك الشخصي متعدد الخطوات للبحث والتجارة والذكاء الاصطناعي.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%236d5dfc'/%3E%3Cstop offset='1' stop-color='%2318b6ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='32' font-family='system-ui' font-weight='800' fill='white'%3EH%3C/text%3E%3C/svg%3E">
  <title>Hessin AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="logo" aria-hidden="true">H</div>
        <div class="brand">
          <h1>Hessin AI</h1>
          <p>وكيلك الشخصي متعدد الخطوات</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="clear" class="ghost" title="محادثة جديدة">محادثة جديدة</button>
        <span id="status" class="status ready" role="status">● جاهز</span>
      </div>
    </header>

    <div id="memoryBanner" class="memory-banner hidden" role="status"></div>
    <div id="digestOffer" class="digest-offer hidden" role="region" aria-label="ملخص يومي">
      <p>ملخص يومي جاهز: تجارة + ذكاء اصطناعي + أسعار في رد واحد.</p>
      <div class="digest-actions">
        <button type="button" id="digestYes" class="digest-yes">اعرض ملخص اليوم</button>
        <button type="button" id="digestSkip" class="digest-skip">لاحقاً</button>
      </div>
    </div>

    <section id="chat" class="chat" aria-live="polite"></section>
    <div id="pending" class="pending hidden"></div>

    <div class="dock">
      <div id="hints" class="hints"></div>
      <form id="form" class="composer">
        <textarea id="input" rows="1" placeholder="اكتب مهمتك هنا…" autocomplete="off" enterkeyhint="send"></textarea>
        <button id="send" type="submit">تنفيذ</button>
      </form>
    </div>
  </main>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script src="/app.js"></script>
</body>
</html>
